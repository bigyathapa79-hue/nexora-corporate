<!doctype html>
<html lang="en">
   <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Nexora | Technology & Business Consulting</title>

    <meta
      name="description"
      content="Nexora is a modern technology and business consulting company specializing in web development, cloud solutions, AI integration, and digital transformation."
    />

    <meta
      name="keywords"
      content="Nexora, Technology Consulting, Business Consulting, Software Development, Web Development, Cloud Computing, AI Solutions, React, Tailwind CSS"
    />

    <meta
      name="author"
      content="Nexora"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#2563EB"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />

    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Nexora | Technology & Business Consulting"
    />

    <meta
      property="og:description"
      content="Helping businesses build digital excellence through innovative technology solutions."
    />

    <meta
      property="og:image"
      content="/cover.jpg"
    />

    <meta
      property="og:url"
      content="https://your-domain.vercel.app"
    />

    <meta
      property="og:site_name"
      content="Nexora"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Nexora | Technology & Business Consulting"
    />

    <meta
      name="twitter:description"
      content="Helping businesses build digital excellence through innovative technology solutions."
    />

    <meta
      name="twitter:image"
      content="/cover.jpg"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
